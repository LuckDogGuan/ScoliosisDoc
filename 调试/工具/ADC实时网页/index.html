<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADC 实时电压</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#18302e;background:#f2f6f5}
*{box-sizing:border-box}body{margin:0}main{max-width:1080px;margin:56px auto;padding:0 28px}
header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:32px;margin:8px 0}
.eyebrow{font-size:12px;letter-spacing:2px;color:#687f7a}.sub{color:#687f7a;font-size:14px;line-height:1.8}
.badge{background:#e3ebe8;border-radius:30px;padding:10px 16px;font-size:13px;white-space:nowrap}
.badge.ok{background:#d8f0e6;color:#12664c}.badge.bad{background:#ffe4e0;color:#a33026}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:30px 0 24px}
.card,.chart{background:white;border:1px solid #dde6e2;border-radius:20px;padding:28px}
.label{font-size:15px;font-weight:600}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#15856f;margin-right:10px}
.blue{background:#4e74cd}.voltage{font-size:clamp(36px,6vw,66px);letter-spacing:-2px;font-variant-numeric:tabular-nums;margin:22px 0 16px;font-weight:600}
.unit{font-size:24px;font-weight:400;color:#87958e;margin-left:8px;letter-spacing:0}
.details{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:#6e8078}.chart-title{display:flex;justify-content:space-between;gap:12px;margin-bottom:20px}
canvas{display:block;width:100%;height:240px}.note{padding:18px 0;font-size:13px;line-height:1.9;color:#6c7f78}
#error{color:#a33026;font-size:14px;margin-top:16px;min-height:20px}footer{font-size:12px;color:#81918a;margin-top:18px}
@media(max-width:650px){main{margin:28px auto;padding:0 16px}header{align-items:start;flex-direction:column}.cards{grid-template-columns:1fr}.card,.chart{padding:22px}.details{flex-wrap:wrap}}
</style>
<main>
<header><div><div class="eyebrow">LUCKFOX · USB / ADB</div><h1>ADC 实时电压</h1><div class="sub">每秒读取两路 ADC，观察当前电压与变化趋势。</div></div><div id="status" class="badge" role="status">正在连接设备…</div></header>
<section class="cards">
<article class="card"><div class="label"><span class="dot"></span>ADC 0</div><div class="voltage"><span id="v0">—</span><span class="unit">V</span></div><div class="details"><span>原始读数 <b id="r0">—</b> / 1023</span><span id="hint0">等待采样</span></div></article>
<article class="card"><div class="label"><span class="dot blue"></span>ADC 1</div><div class="voltage"><span id="v1">—</span><span class="unit">V</span></div><div class="details"><span>原始读数 <b id="r1">—</b> / 1023</span><span id="hint1">等待采样</span></div></article>
</section>
<section class="chart"><div class="chart-title"><span class="label">最近 60 秒</span><span class="sub">电压 / V · 0～1.8</span></div><canvas id="plot" aria-label="ADC0 和 ADC1 最近一分钟电压变化曲线"></canvas><div id="error" role="alert"></div></section>
<div class="note">显示芯片 ADC0、ADC1 输入电压。当前 Pin33 接线不对应这两个通道；此处读数不能当作电池电压。</div>
<footer>设备 <span id="serial">—</span>　·　最近成功读取 <span id="updated">—</span></footer>
</main>
<script>
const $=id=>document.getElementById(id), points=[];
function draw(){
 const canvas=$('plot'),w=canvas.clientWidth,h=240,dpr=window.devicePixelRatio||1;
 canvas.width=w*dpr;canvas.height=h*dpr;const c=canvas.getContext('2d');c.scale(dpr,dpr);
 const left=42,top=12,right=w-10,bottom=h-24;
 c.font='12px Segoe UI';c.textAlign='right';
 for(const v of [0,.6,1.2,1.8]){const y=bottom-v/1.8*(bottom-top);c.strokeStyle='#e8eeeb';c.beginPath();c.moveTo(left,y);c.lineTo(right,y);c.stroke();c.fillStyle='#85948c';c.fillText(v.toFixed(1),left-10,y+4)}
 const now=Date.now();while(points.length&&now-points[0].at>60000)points.shift();
 for(let channel=0;channel<2;channel++){
  c.strokeStyle=channel?'#4e74cd':'#15856f';c.lineWidth=2;c.beginPath();let previous=null;
  for(const p of points){const x=right-(now-p.at)/60000*(right-left),y=bottom-p.values[channel]/1.8*(bottom-top);
   if(!previous||p.at-previous>2500)c.moveTo(x,y);else c.lineTo(x,y);previous=p.at;
  }c.stroke();
  const last=points.at(-1);if(last&&now-last.at<2500){c.beginPath();c.arc(right-(now-last.at)/60000*(right-left),bottom-last.values[channel]/1.8*(bottom-top),3,0,2*Math.PI);c.fillStyle=c.strokeStyle;c.fill()}
 }
 c.fillStyle='#85948c';c.textAlign='left';c.fillText('60 秒前',left,h-3);c.textAlign='right';c.fillText('现在',right,h-3);
}
async function update(){
 const start=Date.now();
 try{
  const res=await fetch('/api/adc',{cache:'no-store',signal:AbortSignal.timeout(6000)});
  if(!res.ok)throw new Error('网页服务暂时不可用');const data=await res.json();if(!data.ok)throw new Error(data.error);
  $('status').textContent='● 正在实时读取';$('status').className='badge ok';$('error').textContent='';
  for(let i=0;i<2;i++){$('v'+i).textContent=data.voltage[i].toFixed(6);$('r'+i).textContent=data.raw[i];$('hint'+i).textContent=data.raw[i]===1023?'满量程': '采样正常'}
  $('serial').textContent=data.serial;$('updated').textContent=new Date(data.time).toLocaleTimeString('zh-CN',{hour12:false});
  points.push({at:Date.now(),values:data.voltage});
 }catch(e){
  $('status').textContent='● 读取中断';$('status').className='badge bad';$('error').textContent=e.message;
  for(let i=0;i<2;i++){$('v'+i).textContent='—';$('r'+i).textContent='—';$('hint'+i).textContent='等待重新连接'}
 }finally{draw();setTimeout(update,Math.max(0,1000-(Date.now()-start)))}
}
window.addEventListener('resize',draw);draw();update();
</script>
</html>
